name: package

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: >-
          python tools/release/audit_packages.py
          --wheel dist/gpu_shortmd_screening-0.1.0-py3-none-any.whl
          --sdist dist/gpu_shortmd_screening-0.1.0.tar.gz
      - run: python -m venv /tmp/gpu-shortmd-clean-install
      - run: /tmp/gpu-shortmd-clean-install/bin/python -m pip install dist/*.whl
      - run: /tmp/gpu-shortmd-clean-install/bin/gpu-shortmd --help
      - run: >-
          /tmp/gpu-shortmd-clean-install/bin/gpu-shortmd
          validate-example examples/egfr_p00533_1xkk_fmm_p2_model4
