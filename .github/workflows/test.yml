name: test

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest tests/unit tests/analysis tests/integration
      - run: python tools/release/audit_repository.py --root .
