[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-shortmd-screening"
version = "0.1.0"
description = "GPU runtime-steered ultrashort-MD screening for prepared GROMACS systems"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Natsuki Kanazawa"},
  {name = "Junta Asano"},
  {name = "Mitsugu Araki"},
  {name = "Takao Otsuka"},
  {name = "Shigeyuki Matsumoto"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.26,<3",
  "packaging>=23,<27",
  "psutil>=5.9,<8",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "setuptools>=77",
  "types-PyYAML>=6,<7",
  "wheel",
]

[project.urls]
Repository = "https://github.com/clinfo/gpu-runtime-steered-ultrashort-md-screening"
Documentation = "https://github.com/clinfo/gpu-runtime-steered-ultrashort-md-screening#readme"
Issues = "https://github.com/clinfo/gpu-runtime-steered-ultrashort-md-screening/issues"
Preprint = "https://chemrxiv.org/doi/abs/10.26434/chemrxiv.15006352/v1"

[project.scripts]
gpu-shortmd = "gpu_shortmd.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_shortmd = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gpu_shortmd"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
